  trip-sheet-be:
    build: .
    restart: always
    container_name: trip-sheet-be
    env_file:
      - .env
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    ports:
      - "${APP_PORT}:8080"
    depends_on:
      redis:
        condition: service_healthy
    # depends_on:
    #   mysql:  
    #     condition: service_healthy
    networks:
      - trip-sheet-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trip-sheet-network:
    driver: bridge
