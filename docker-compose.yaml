services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    container_name: trip-sheet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trip-sheet-network

