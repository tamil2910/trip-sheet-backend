spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

server.address=0.0.0.0
server.port=8080

spring.application.admin.enabled=false
spring.jmx.enabled=false

spring.devtools.restart.enabled=true

jwt.secret=${JWT_SECRET:${jwt_secret:}}

server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG



logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log entity loading
logging.level.org.hibernate.loader.entity=TRACE

# Transaction debug
logging.level.org.springframework.transaction=TRACE
logging.level.com.fasterxml.jackson.databind=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

