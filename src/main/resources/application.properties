spring.config.import=optional:file:.env[.properties]

spring.threads.virtual.enabled=true

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.validation-timeout=${SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT:5000}
spring.datasource.hikari.idle-timeout=${SPRING_DATASOURCE_HIKARI_IDLE_TIMEOUT:120000}
spring.datasource.hikari.max-lifetime=${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME:240000}
spring.datasource.hikari.keepalive-time=${SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME:60000}
# spring.datasource.hikari.initialization-fail-timeout=${SPRING_DATASOURCE_HIKARI_INIT_FAIL_TIMEOUT:0}
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.data-source-properties.connectTimeout=${SPRING_DATASOURCE_CONNECT_TIMEOUT:10000}
spring.datasource.hikari.data-source-properties.socketTimeout=${SPRING_DATASOURCE_SOCKET_TIMEOUT:30000}
spring.datasource.hikari.data-source-properties.tcpKeepAlive=${SPRING_DATASOURCE_TCP_KEEP_ALIVE:true}

spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.MySQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql
# spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=${SPRING_JPA_ALLOW_JDBC_METADATA_ACCESS:false}

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=ERROR

server.address=0.0.0.0
server.port=8080

spring.application.admin.enabled=false
spring.jmx.enabled=false

spring.devtools.restart.enabled=true

jwt.secret=${JWT_SECRET:${jwt_secret:}}

# SendGrid Configuration
sendgrid.api.key=${SENDGRID_API_KEY:${email_config_key:}}
# sendgrid.from.email=${SENDGRID_FROM_EMAIL:${sendgrid.from.email:}}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}

# Legacy SMTP Configuration (optional fallback)
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.feedback.link-base=${APP_FEEDBACK_LINK_BASE:http://localhost:4200/feedback}
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:4200,http://localhost:4400,http://127.0.0.1:4200,http://127.0.0.1:4400,https://trip-sheet-frontend.vercel.app,https://*.vercel.app}

server.error.include-stacktrace=always
logging.level.org.springframework.web=DEBUG



logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Log entity loading
logging.level.org.hibernate.loader.entity=TRACE

# Transaction debug
logging.level.org.springframework.transaction=TRACE
logging.level.com.fasterxml.jackson.databind=TRACE
logging.level.org.springframework.http.converter.json=DEBUG

# spring.datasource.hikari.maximum-pool-size=3
# spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=20
spring.jpa.open-in-view=true
